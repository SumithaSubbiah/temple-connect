# Server
server.port=8080
spring.application.name=gateway-service

# JWT (must match auth-service)
app.jwt.secret=change-this-to-a-long-random-string-please
app.jwt.issuer=temple-auth

# Spring Cloud Gateway Route
spring.cloud.gateway.routes[0].id=temple-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].uri=http://temple-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/temple/**,/debug/**

# Route 1 - auth
spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=http://auth-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[2].id=auth-oauth2
spring.cloud.gateway.routes[2].uri=http://auth-service:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/oauth2/**,/login/**

spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=http://booking-service:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/bookings/**

spring.cloud.gateway.routes[4].id=donation-service
spring.cloud.gateway.routes[4].uri=http://donation-service:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/donations/**

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=http://payment-service:8087
spring.cloud.gateway.routes[5].predicates[0]=Path=/payment/**

# --- CORS for React dev server ---
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
