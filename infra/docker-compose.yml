version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: templedb
      POSTGRES_USER: temple
      POSTGRES_PASSWORD: temple
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  temple-service:
    build: ../temple-service
    container_name: temple-service
    depends_on:
      - postgres
    ports:
      - "8081:8081"
  
  auth-service:
    build: ../auth-service
    container_name: auth-service
    depends_on:
      - postgres
    ports:
      - "8082:8082"
    environment:
    - GOOGLE_CLIENT_ID=386939923626-jrplhlac2os0fm47okotjo7bi01h2ba8.apps.googleusercontent.com
    - GOOGLE_CLIENT_SECRET=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

  booking-service:
    build: ../booking-service
    container_name: booking-service
    depends_on:
      - postgres
    ports:
      - "8083:8083"
  donation-service:
    build: ../donation-service
    container_name: donation-service
    depends_on:
      - postgres
    ports:
      - "8084:8084"

  notification-service:
    build: ../notification-service
    container_name: notification-service
    depends_on:
      - kafka
    ports:
      - "8085:8085"

  slot-service:
    build: ../slot-service
    container_name: slot-service
    depends_on:
      - kafka
    ports:
      - "8086:8086"		

  payment-service:
    build: ../payment-service
    container_name: payment-service
    depends_on:
      - kafka
    ports:
      - "8087:8087"

  gateway-service:
    build: ../gateway-service
    container_name: gateway-service
    depends_on:
      - temple-service
    ports:
      - "8080:8080"
