server.port=8081

#postgres is the Docker service name, not localhost.
spring.datasource.url=jdbc:postgresql://postgres:5432/templedb
spring.datasource.username=temple
spring.datasource.password=temple

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.initializationFailTimeout=60000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.maximumPoolSize=5

server.tomcat.threads.max=2
server.tomcat.accept-count=5

management.endpoints.web.exposure.include=*
